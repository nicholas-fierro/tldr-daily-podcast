name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Confirms the optional Kokoro lock still resolves and imports cleanly.
  # Import only — never instantiates KPipeline, which would download model
  # weights. No live calls, per AGENTS.md.
  kokoro-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-kokoro.txt
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements-kokoro.txt
      - run: python -c "from kokoro import KPipeline"
