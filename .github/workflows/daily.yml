name: daily episode

on:
  schedule:
    # UTC only, and Actions cron does not follow DST. These three land safely
    # after TLDR's 6-7am ET publication window year-round. Freshness and
    # delivery markers mean only the first run with a fresh edition does work.
    - cron: "15 11 * * 1-5"
    - cron: "15 12 * * 1-5"
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD). Blank = latest."
        required: false
      edition:
        description: "TLDR edition slug"
        required: false
        default: tech
      stage:
        description: "Stop after this stage (fetch/parse/enrich/script/audio/publish)"
        required: false
        default: publish

# Three overlapping triggers must never race each other into duplicate delivery.
concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg

      - name: Resolve email delivery date
        id: email_key
        if: vars.ENABLE_R2_PUBLISH != 'true'
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [[ -n "$REQUESTED_DATE" ]]; then
            if [[ ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid edition date: $REQUESTED_DATE" >&2
              exit 2
            fi
            edition_date="$REQUESTED_DATE"
          else
            edition_date="$(TZ=America/New_York date +%F)"
          fi
          echo "date=$edition_date" >> "$GITHUB_OUTPUT"

      - name: Restore email delivery marker
        id: email_marker_cache
        if: >-
          vars.ENABLE_R2_PUBLISH != 'true' &&
          (github.event_name == 'schedule' || inputs.stage == 'publish')
        uses: actions/cache/restore@v4
        with:
          path: .email-state/sent
          key: emailed-${{ inputs.edition || 'tech' }}-${{ steps.email_key.outputs.date }}

      - name: Run pipeline and email episode
        id: email_run
        if: >-
          vars.ENABLE_R2_PUBLISH != 'true' &&
          steps.email_marker_cache.outputs.cache-hit != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL || 'true' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python main.py \
            --edition "${{ inputs.edition || 'tech' }}" \
            --stage "${{ inputs.stage || 'publish' }}" \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            --email \
            --email-marker .email-state/sent \
            --verbose

      - name: Run pipeline and publish to R2
        id: r2_run
        if: vars.ENABLE_R2_PUBLISH == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python main.py \
            --edition "${{ inputs.edition || 'tech' }}" \
            --stage "${{ inputs.stage || 'publish' }}" \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            --verbose

      - name: Check email delivery marker
        id: email_sent
        if: >-
          always() &&
          vars.ENABLE_R2_PUBLISH != 'true' &&
          steps.email_run.outcome == 'success'
        run: |
          if [[ -f .email-state/sent ]]; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save email delivery marker
        if: >-
          steps.email_sent.outputs.sent == 'true' &&
          steps.email_marker_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .email-state/sent
          key: emailed-${{ inputs.edition || 'tech' }}-${{ steps.email_key.outputs.date }}

      # Snapshot and script aid debugging. MP3 stays out of Actions artifacts.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            out/*.html
            out/*.script.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{text: ("TLDR podcast build failed: " + $run)}')"
