name: daily episode

on:
  schedule:
    # UTC only, and Actions cron does not follow DST. One combined episode per
    # day; the delivery marker makes delayed or repeated runs no-ops. Later than
    # a per-edition run would need: every source has to have published before we
    # build, or it is silently omitted from the day's episode.
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "15 15 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD). Blank = latest."
        required: false
      stage:
        description: "Stop after this stage (fetch/parse/combine/enrich/script/audio/publish)"
        required: false
        default: publish

jobs:
  build:
    name: build (daily)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: daily-combined
      cancel-in-progress: false

    steps:
      - name: Resolve target date
        id: edition_key
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_DATE" ]]; then
            if [[ ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid edition date: $REQUESTED_DATE" >&2
              exit 2
            fi
            edition_date="$REQUESTED_DATE"
          else
            # The anchor edition fixes the target date; every other source must
            # match it exactly or is omitted and reported.
            final_url="$(curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{url_effective}' \
              "https://tldr.tech/api/latest/tech")"
            if [[ "$final_url" =~ /([0-9]{4}-[0-9]{2}-[0-9]{2})/?$ ]]; then
              edition_date="${BASH_REMATCH[1]}"
            else
              echo "Could not resolve edition date from $final_url" >&2
              exit 1
            fi
          fi

          marker=".email-state/daily-${edition_date}.sent"
          echo "date=$edition_date" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

      - name: Restore email delivery marker
        id: email_marker_cache
        if: >-
          vars.ENABLE_R2_PUBLISH != 'true' &&
          (github.event_name == 'schedule' || inputs.stage == 'publish')
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.edition_key.outputs.marker }}
          key: emailed-daily-${{ steps.edition_key.outputs.date }}

      - name: Decide whether work is needed
        id: guard
        env:
          ENABLE_R2_PUBLISH: ${{ vars.ENABLE_R2_PUBLISH }}
          EMAIL_CACHE_HIT: ${{ steps.email_marker_cache.outputs.cache-hit }}
        run: |
          if [[ "$ENABLE_R2_PUBLISH" != "true" && "$EMAIL_CACHE_HIT" == "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-kokoro.txt

      - name: Install Python dependencies
        if: steps.guard.outputs.run == 'true'
        env:
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'gemini' }}
          PIPELINE_STAGE: ${{ inputs.stage || 'publish' }}
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          if [[ "${TTS_PROVIDER,,}" == "kokoro" &&
                ( "$PIPELINE_STAGE" == "audio" || "$PIPELINE_STAGE" == "publish" ) ]]; then
            pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              torch==2.13.0
            pip install -r requirements-kokoro.txt
          fi

      - name: Ensure ffmpeg is available
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version
            ffprobe -version
            exit 0
          fi

          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ffmpeg; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "ffmpeg installation failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Ensure Kokoro speech backend is available
        if: steps.guard.outputs.run == 'true'
        env:
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'gemini' }}
          PIPELINE_STAGE: ${{ inputs.stage || 'publish' }}
        run: |
          set -euo pipefail
          if [[ "${TTS_PROVIDER,,}" != "kokoro" ||
                ( "$PIPELINE_STAGE" != "audio" && "$PIPELINE_STAGE" != "publish" ) ]]; then
            exit 0
          fi
          if command -v espeak-ng >/dev/null; then
            espeak-ng --version
            exit 0
          fi

          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y espeak-ng; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "espeak-ng installation failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          espeak-ng --version

      - name: Restore Kokoro model cache
        if: >-
          steps.guard.outputs.run == 'true' &&
          vars.TTS_PROVIDER == 'kokoro' &&
          (github.event_name == 'schedule' ||
           inputs.stage == 'audio' || inputs.stage == 'publish')
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-${{ runner.os }}-${{ runner.arch }}-0.9.4

      - name: Run pipeline and email episode
        id: email_run
        if: >-
          steps.guard.outputs.run == 'true' &&
          vars.ENABLE_R2_PUBLISH != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL || 'true' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python main.py \
            --bundle daily \
            --stage "${{ inputs.stage || 'publish' }}" \
            --local "out/daily" \
            ${{ inputs.date && format('--date {0}', inputs.date) || format('--resolved-date {0}', steps.edition_key.outputs.date) }} \
            --email \
            --email-marker "${{ steps.edition_key.outputs.marker }}" \
            --verbose

      - name: Run pipeline and publish to R2
        id: r2_run
        if: >-
          steps.guard.outputs.run == 'true' &&
          vars.ENABLE_R2_PUBLISH == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python main.py \
            --bundle daily \
            --stage "${{ inputs.stage || 'publish' }}" \
            --local "out/daily" \
            ${{ inputs.date && format('--date {0}', inputs.date) || format('--resolved-date {0}', steps.edition_key.outputs.date) }} \
            --verbose

      - name: Check email delivery marker
        id: email_sent
        if: >-
          always() &&
          vars.ENABLE_R2_PUBLISH != 'true' &&
          steps.email_run.outcome == 'success'
        env:
          MARKER: ${{ steps.edition_key.outputs.marker }}
        run: |
          if [[ -f "$MARKER" ]]; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save email delivery marker
        if: >-
          steps.email_sent.outputs.sent == 'true' &&
          steps.email_marker_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.edition_key.outputs.marker }}
          key: emailed-daily-${{ steps.edition_key.outputs.date }}

      # Snapshot and script aid debugging. MP3 stays out of Actions artifacts.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}-daily
          path: |
            out/daily/*.html
            out/daily/*.script.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [[ -z "$ALERT_WEBHOOK_URL" ]]; then
            exit 0
          fi
          curl -sS -X POST "$ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{text: ("TLDR daily podcast build failed: " + $run)}')"
